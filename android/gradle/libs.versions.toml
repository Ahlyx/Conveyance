# The single place every Android toolchain and dependency version lives.
# Phase 10.0 pins a known-good late-2024 set so the empty scaffold builds
# deterministically; the spec's "target SDK current-latest" push (API 36,
# newer AGP) is a one-line change here once CI on this baseline is green.
[versions]
agp = "8.7.3"
kotlin = "2.0.21"
ksp = "2.0.21-1.0.28"
hilt = "2.52"

# minSdk is spec-fixed at 30 (Android 11). compile/target are the
# "latest stable" knob -- 35 for now (see file header).
minSdk = "30"
compileSdk = "35"
targetSdk = "35"

coreKtx = "1.15.0"
coreSplashscreen = "1.0.1"
lifecycleRuntimeKtx = "2.8.7"
activityCompose = "1.9.3"
composeBom = "2024.10.01"

junit = "4.13.2"

# Phase 10.1 UniFFI spike. JNA is the runtime the generated Kotlin
# crypto bindings call through; the @aar variant carries JNA's own
# per-ABI natives. androidx.test.* drive the on-emulator instrumented
# test that round-trips a value through those bindings.
jna = "5.14.0"
androidxTestExtJunit = "1.2.1"
androidxTestRunner = "1.6.2"

# Phase 10.2b encrypted storage. Room 2.6.1 is the last release that
# works with the KSP 1.0.x pinned above; androidx.sqlite 2.4.0 is its
# paired version. SQLCipher via net.zetetic:sqlcipher-android (the
# maintained successor to android-database-sqlcipher); it supplies the
# SupportSQLiteOpenHelper.Factory Room opens the encrypted DB through.
room = "2.6.1"
androidxSqlite = "2.4.0"
sqlcipher = "4.6.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-core-splashscreen = { group = "androidx.core", name = "core-splashscreen", version.ref = "coreSplashscreen" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-graphics = { group = "androidx.compose.ui", name = "ui-graphics" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
hilt-android = { group = "com.google.dagger", name = "hilt-android", version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-compiler", version.ref = "hilt" }
hilt-android-testing = { group = "com.google.dagger", name = "hilt-android-testing", version.ref = "hilt" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room" }
androidx-room-ktx = { group = "androidx.room", name = "room-ktx", version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler", version.ref = "room" }
androidx-sqlite = { group = "androidx.sqlite", name = "sqlite", version.ref = "androidxSqlite" }
sqlcipher-android = { group = "net.zetetic", name = "sqlcipher-android", version.ref = "sqlcipher" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
hilt = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
