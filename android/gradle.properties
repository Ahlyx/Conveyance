# JVM heap for the Gradle daemon. UTF-8 so source encoding is explicit
# across the three dev platforms.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Parallel + build cache: safe for this project, meaningful once modules
# multiply in later sub-phases.
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX only; no legacy support-library shims.
android.useAndroidX=true

# Per-module R classes (smaller, faster) -- the modern default, pinned.
android.nonTransitiveRClass=true

kotlin.code.style=official
