[workspace]
resolver = "3"
members = [
    "crates/conveyance-core",
    "crates/conveyance-daemon",
    "crates/conveyance-shim",
    "crates/conveyance",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Floor we actually verify against (local + CI), not a theoretical minimum.
# Edition 2024 would only require 1.85; dependencies are what push this up.
# Recorded here so cargo enforces it with a clear error instead of letting
# an older toolchain produce confusing failures.
rust-version = "1.90"

# Pinned with `=` so the manifest itself states the tested version. Cargo.lock
# records the resolved graph; these pins record intent. Bump deliberately,
# never transitively.
#
# Runtime decision (recorded phase 0): async work will use tokio. The pin
# enters [workspace.dependencies] in phase 3, when the first crate consumes
# it -- an unused entry here would sit in Cargo.lock implying a dependency
# that does not exist yet.
[workspace.dependencies]
serde = "=1.0.229"
serde_json = "=1.0.151"
thiserror = "=2.0.20"
toml = "=0.8.23"
dirs = "=6.0.0"
# Test-only, but declared here so the pin lives with the others.
tempfile = "=3.27.0"
#
# Crypto stack (phase 1). Pins chosen as a mutually compatible SET, not
# individually: the RustCrypto crates share the `digest` trait family, and
# mixing majors across that family fails to compile in confusing ways.
# sha2/blake2/hkdf stay on the digest-0.10 generation deliberately --
# they are the versions these crates shipped and were audited in the wild
# with, and blake2 has not published a digest-0.11 release to move to.
# The dalek crates are consumed WITHOUT their rand features: Conveyance
# generates entropy via getrandom directly, so no rand_core version
# coupling exists anywhere in the stack.
ed25519-dalek = "=3.0.0"
x25519-dalek = { version = "=3.0.0", features = ["static_secrets"] }
chacha20poly1305 = "=0.11.0"
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc"] }
bip39 = "=2.2.2"
# NOTE: hkdf/hmac crates were evaluated and rejected for phase 1: they
# cannot wrap BLAKE2s (its digest core is Lazy-buffered; HmacCore requires
# Eager), so HKDF-BLAKE2s is implemented in conveyance-core over raw
# sha2/blake2 instead -- see crypto/recovery.rs. Revisit only alongside a
# digest-generation bump of the whole stack.
blake2 = "=0.10.6"
sha2 = "=0.10.8"
# Canonical JSON (RFC 8785) is implemented in conveyance-core rather than
# via the serde_jcs crate: serde_jcs delegates key ordering to serde_json's
# map flavor, which yields Unicode-code-point order instead of the UTF-16
# code-unit order RFC 8785 mandates -- a silent signature-portability bug
# for astral-plane keys. See crypto/canonical_json.rs.
zeroize = { version = "=1.9.0", features = ["derive"] }
getrandom = "=0.4.3"
#
# Storage (phase 2). `bundled` compiles SQLite from source so no system
# library is involved -- matches auditmcp, keeps cross-platform builds
# and CI deterministic.
rusqlite = { version = "=0.40.2", features = ["bundled"] }
# Keychain backends are feature-gated per platform in keyring 4.x; chosen
# deliberately rather than accepting whatever resolves. For Linux,
# `zbus-secret-service-keyring-store` is the pure-Rust D-Bus path (the
# alternative, `dbus-secret-service-keyring-store`, binds the C libdbus);
# `windows-native` / `apple-native` are the OS credential managers.
# `v1` is the crate's default API-version flag, kept on.
keyring = { version = "=4.1.6", features = [
    "v1",
    "apple-native-keyring-store",
    "windows-native-keyring-store",
    "zbus-secret-service-keyring-store",
] }
#
# Runtime decision recorded in phase 0, consumed from phase 3 onward:
# tokio drives session timers (and later, transport/IPC). Features are
# the minimal set actually used; if a phase reaches for net or io-util,
# that is a deliberate decision to record here, not an accident.
tokio = { version = "=1.53.1", features = [
    "rt-multi-thread",
    "macros",
    "time",
    "sync",
] }
#
# Noise sessions. Pattern string is fixed by the spec:
# Noise_KK_25519_ChaChaPoly_BLAKE2s.
snow = "=0.10.0"
#
# Wire protocol (phase 4): CBOR for message encoding. ciborium is
# serde-native and handles byte strings + tagged enums cleanly.
ciborium = "=0.2.2"
#
# Pairing ceremony (phase 6): QR rendering, base64url payload envelope,
# replay-gate bloom filter (fixed-seed variant for restart persistence),
# and the CLI framework.
qrcode = { version = "=0.14.1", default-features = false }
base64 = "=0.23.1"
bloomfilter = "=3.0.1"
clap = { version = "=4.6.6", features = ["derive"] }
#
# BLE transport (phase 5), feature-gated: see conveyance-core's [features].
# uuid is consumed by the BLE module (GATT UUIDs) and its v4 feature by
# the probe example/tests only.
btleplug = "=0.12.0"
uuid = { version = "=1.25.0", features = ["v4"] }
# StreamExt for btleplug's notification stream (BLE feature only).
futures-lite = "=2.6.1"
