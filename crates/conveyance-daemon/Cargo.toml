[package]
name = "conveyance-daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Conveyance daemon: session ownership, request routing, IPC server, and BLE connectivity to the phone"

[lib]
name = "conveyance_daemon"
path = "src/lib.rs"

[[bin]]
name = "conveyance-daemon"
path = "src/main.rs"

[dependencies]
conveyance-core = { path = "../conveyance-core" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
ciborium.workspace = true
interprocess.workspace = true

[dev-dependencies]
tempfile.workspace = true
# Re-declared here with the test-support feature so the daemon's unit
# tests get conveyance_core::test_support (shared keychain stub).
conveyance-core = { path = "../conveyance-core", features = ["test-support"] }

[features]
ble = ["conveyance-core/ble"]
# Scripted phone for end-to-end MCP client verification without radio
# hardware. Off in every production build; activated only by explicit
# test tooling. Pulls the core test-support feature so the mockphone
# module can re-export the shared keychain stub.
mock-phone = ["conveyance-core/test-support"]