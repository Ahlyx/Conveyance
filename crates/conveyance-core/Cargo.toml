[package]
name = "conveyance-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared foundations for Conveyance: crypto, storage, sessions, wire protocol, transport, pairing, config, error model"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
bip39.workspace = true
blake2.workspace = true
sha2.workspace = true
zeroize.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
keyring.workspace = true
tokio.workspace = true
snow.workspace = true
ciborium.workspace = true
qrcode.workspace = true
base64.workspace = true
bloomfilter.workspace = true
btleplug = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }

[features]
# Real BLE transport (btleplug). Default OFF so that: (a) CI and every
# existing test run without platform BLE stacks; (b) a future Android
# UniFFI build of this crate does not drag a BLE central implementation
# onto the phone. The daemon crate opts in.
ble = ["dep:btleplug", "dep:uuid", "dep:futures-lite"]

[dev-dependencies]
tempfile.workspace = true
# test-util enables tokio::time::pause()/advance() for deterministic
# timer tests. Dev-only: production builds never see it.
tokio = { workspace = true, features = ["test-util"] }
