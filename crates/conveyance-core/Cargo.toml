[package]
name = "conveyance-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared foundations for Conveyance: crypto, storage, sessions, wire protocol, transport, pairing, config, error model"

[dependencies]
# Cryptographic primitives now live in their own crate so they can
# cross-compile to Android (phase 10.1). Re-exported below as
# `conveyance_core::crypto`, so call sites in this crate and the
# daemon/shim/CLI are unchanged.
conveyance-crypto = { path = "../conveyance-crypto" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
dirs.workspace = true
# blake2 / sha2 are still used directly outside the crypto module
# (storage/identity.rs, storage/pairings.rs); zeroize likewise
# (session, storage/identity.rs).
blake2.workspace = true
sha2.workspace = true
zeroize.workspace = true
rusqlite.workspace = true
keyring.workspace = true
tokio.workspace = true
snow.workspace = true
ciborium.workspace = true
qrcode.workspace = true
base64.workspace = true
bloomfilter.workspace = true
btleplug = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }
futures-lite = { workspace = true, optional = true }

[features]
# Real BLE transport (btleplug). Default OFF so that: (a) CI and every
# existing test run without platform BLE stacks; (b) a future Android
# UniFFI build of this crate does not drag a BLE central implementation
# onto the phone. The daemon crate opts in.
ble = ["dep:btleplug", "dep:uuid", "dep:futures-lite"]
# Exposes `conveyance_core::test_support` (the in-memory keychain stub)
# to dependent crates' test suites. `#[cfg(test)]` items do not cross
# crate boundaries; without this the daemon and shim would each
# re-implement the same double.
test-support = []

[dev-dependencies]
# The crypto crate's deterministic/failing EntropySource seams, used by
# the pairing/session/wire/storage test suites here. Same crate as the
# [dependencies] entry above; cargo unions the features for test builds.
conveyance-crypto = { path = "../conveyance-crypto", features = ["test-support"] }
tempfile.workspace = true
# test-util enables tokio::time::pause()/advance() for deterministic
# timer tests. Dev-only: production builds never see it.
tokio = { workspace = true, features = ["test-util"] }
