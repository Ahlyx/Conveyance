[package]
name = "conveyance-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Shared foundations for Conveyance: platform paths, config, error model"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
dirs.workspace = true
ed25519-dalek.workspace = true
x25519-dalek.workspace = true
chacha20poly1305.workspace = true
argon2.workspace = true
bip39.workspace = true
blake2.workspace = true
sha2.workspace = true
zeroize.workspace = true
getrandom.workspace = true
rusqlite.workspace = true
keyring.workspace = true
tokio.workspace = true
snow.workspace = true
ciborium.workspace = true

[dev-dependencies]
tempfile.workspace = true
# test-util enables tokio::time::pause()/advance() for deterministic
# timer tests. Dev-only: production builds never see it.
tokio = { workspace = true, features = ["test-util"] }
