[package]
name = "conveyance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Conveyance CLI: pair, and later daemon/shim/log subcommands"

[[bin]]
name = "conveyance"
path = "src/main.rs"

[dependencies]
conveyance-core = { path = "../conveyance-core" }
conveyance-daemon = { path = "../conveyance-daemon" }
conveyance-shim = { path = "../conveyance-shim" }
serde_json.workspace = true
clap.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
assert_cmd.workspace = true
predicates.workspace = true
rusqlite.workspace = true

[features]
# Real BLE for `pair`. Default OFF (see core); release builds enable it.
ble = ["conveyance-core/ble"]
# Forwards the daemon's scripted-phone mode for E2E testing; also off
# in every production build.
mock-phone = ["conveyance-daemon/mock-phone"]