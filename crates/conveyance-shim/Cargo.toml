[package]
name = "conveyance-shim"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Conveyance MCP shim: JSON-RPC over stdio on behalf of MCP clients"

[dependencies]
conveyance-core = { path = "../conveyance-core" }
conveyance-daemon = { path = "../conveyance-daemon" }
serde.workspace = true
serde_json.workspace = true
# io-std/io-util drive the stdio transport; rt for the local runtime.
tokio = { workspace = true, features = ["io-std", "io-util", "rt"] }

[dev-dependencies]
# Tests drive a real daemon; the mock phone removes the BLE dependency.
tempfile.workspace = true
conveyance-daemon = { path = "../conveyance-daemon", features = ["mock-phone"] }
