name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings without needing -D warnings on every
  # invocation below.
  RUSTFLAGS: -D warnings

jobs:
  # Formatting and lints are OS-independent, so they run once rather than
  # three times across the test matrix.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # No pinned channel here on purpose: @master with no `toolchain`
      # input makes the action read rust-toolchain.toml, so CI and local
      # dev resolve to the exact same rustc/clippy version. A clippy lint
      # that only one side sees is the failure mode this prevents.
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three platforms the spec commits us to supporting. macOS in
        # particular is CI-only until phase 11 says otherwise.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # Reads rust-toolchain.toml (see the lint job).
      - uses: dtolnay/rust-toolchain@master
      - uses: Swatinem/rust-cache@v2
      # --locked: CI tests exactly what the committed Cargo.lock resolved,
      # not whatever crates.io serves that day. The manifest's `=` pins and
      # this flag are two halves of the same reproducibility decision.
      - run: cargo build --locked --release
      - run: cargo test --locked
