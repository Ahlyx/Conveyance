name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail the build on warnings without needing -D warnings on every
  # invocation below.
  RUSTFLAGS: -D warnings

jobs:
  # Formatting and lints are OS-independent, so they run once rather than
  # three times across the test matrix.
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Keep in sync with rust-toolchain.toml at repo root.
      # When bumping the pin, update both this workflow and the toml.
      # (dtolnay/rust-toolchain requires an explicit toolchain input; it
      # does not read rust-toolchain.toml.)
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three platforms the spec commits us to supporting. macOS in
        # particular is CI-only until phase 11 says otherwise.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v5
      # Keep in sync with rust-toolchain.toml at repo root.
      # When bumping the pin, update both this workflow and the toml.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # --locked: CI tests exactly what the committed Cargo.lock resolved,
      # not whatever crates.io serves that day. The manifest's `=` pins and
      # this flag are two halves of the same reproducibility decision.
      - run: cargo build --locked --release
      - run: cargo test --locked
