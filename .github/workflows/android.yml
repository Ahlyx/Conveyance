name: Android CI

# Scoped to the Android track. The Rust workflow (ci.yml) is scoped away
# from android/**, but the Android build cross-compiles conveyance-crypto-ffi
# (phase 10.1 UniFFI bridge) and — through it — conveyance-noise (phase
# 10.4 Noise KK session), so changes to those crates, their
# conveyance-crypto dependency, and the workspace manifests must trigger
# this workflow. conveyance-wire (phase 10.3) and conveyance-noise are
# also here because they emit *_fixtures.json that the Android parity
# suites replay — a rule change not mirrored into a fixture must fail here.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "crates/conveyance-crypto/**"
      - "crates/conveyance-crypto-ffi/**"
      - "crates/conveyance-wire/**"
      - "crates/conveyance-noise/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "crates/conveyance-crypto/**"
      - "crates/conveyance-crypto-ffi/**"
      - "crates/conveyance-wire/**"
      - "crates/conveyance-noise/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: rust bridge + lint + unit + assemble + instrumented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # AGP 8.x requires JDK 17. The ubuntu runner ships the Android SDK
      # and NDK (ANDROID_HOME / ANDROID_NDK_LATEST_HOME preset).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Rust side of the UniFFI bridge. Toolchain pinned to match
      # rust-toolchain.toml / ci.yml; both Android ABIs added as targets.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # cargo-ndk finds the NDK via ANDROID_NDK_HOME; the runner only
      # sets ANDROID_NDK_LATEST_HOME by default.
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # Fixture drift gate. crypto_fixtures.json is ground truth for the
      # instrumented Rust<->Kotlin parity suite; regenerate it from
      # conveyance-crypto and fail if it differs from the committed copy,
      # so a change to a primitive that is not mirrored into the fixture
      # (and thus into the Kotlin assertion) cannot land silently.
      - name: Regenerate crypto fixtures and check for drift
        run: |
          cargo run --locked -p conveyance-crypto --example emit_fixtures -- \
            android/app/src/androidTest/assets/crypto_fixtures.json
          git diff --exit-code -- android/app/src/androidTest/assets/crypto_fixtures.json \
            || { echo "::error::crypto_fixtures.json is stale; run the emitter and commit it"; exit 1; }

      # Same gate for the framing layer. framing_fixtures.json is ground
      # truth for the JVM Rust<->Kotlin framing parity suite; regenerate
      # from conveyance-wire and fail on any diff, so a framing-rule change
      # not mirrored into the fixture (and the Kotlin assertion) cannot
      # land silently. cargo test already runs the same check locally.
      - name: Regenerate framing fixtures and check for drift
        run: |
          cargo run --locked -p conveyance-wire --example emit_framing_fixtures -- \
            android/app/src/test/resources/framing_fixtures.json
          git diff --exit-code -- android/app/src/test/resources/framing_fixtures.json \
            || { echo "::error::framing_fixtures.json is stale; run the emitter and commit it"; exit 1; }

      # Same gate for the Noise KK handshake. noise_fixtures.json is
      # ground truth for the instrumented Rust<->Kotlin parity suite;
      # regenerate from conveyance-noise (needs --features test-vectors
      # for the fixed-ephemeral emitter) and fail on any diff.
      - name: Regenerate Noise fixtures and check for drift
        run: |
          cargo run --locked -p conveyance-noise --features test-vectors \
            --example emit_noise_fixtures -- \
            android/app/src/androidTest/assets/noise_fixtures.json
          git diff --exit-code -- android/app/src/androidTest/assets/noise_fixtures.json \
            || { echo "::error::noise_fixtures.json is stale; run the emitter and commit it"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew
        working-directory: android

      # KVM permissions so the emulator runs with hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cross-compiles conveyance-crypto-ffi to a .so for BOTH ABIs
      # (arm64-v8a is build-verified here; x86_64 is exercised by the
      # instrumented tests below), generates the Kotlin bindings, runs
      # lint + JVM unit tests + assembles the APK, then runs the
      # instrumented suite on an x86_64 emulator.
      #
      # `locksettings set-pin` gives the emulator a secure lock screen so
      # the auth-required conveyance_tier1 AndroidKeyStore key provisions
      # (KeystoreKeysTest). Tests that need it are assumeTrue-guarded on
      # isDeviceSecure, so this is what makes them run rather than skip.
      - name: lint + unit + assemble + instrumented
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          working-directory: android
          script: |
            adb shell locksettings set-pin 0000 || echo "set-pin failed; tier1 key tests will skip"
            ./gradlew --no-daemon lintDebug testDebugUnitTest assembleDebug connectedDebugAndroidTest

      # testDebugUnitTest also passes vacuously if a suite silently stops
      # being discovered. Assert a floor and that the framing fixture
      # parity suite (Rust<->Kotlin wire-format drift gate) actually ran.
      - name: Verify JVM unit tests ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob("android/app/build/test-results/testDebugUnitTest/*.xml")
          if not files:
              sys.exit("no JVM unit test result XML found")
          total = bad = 0
          classes = set()
          for f in files:
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0))
              bad += int(r.get("failures", 0)) + int(r.get("errors", 0))
              classes.add(r.get("name", ""))
          print(f"JVM unit tests: {total}, failures+errors: {bad}")
          print("classes:", ", ".join(sorted(classes)))
          if total < 35:
              sys.exit(f"expected >= 35 JVM unit tests, saw {total}")
          required = [
              "com.ahlyxlabs.conveyance.transport.framing.FramingFixtureParityTest",
              "com.ahlyxlabs.conveyance.transport.framing.FramerTest",
          ]
          missing = [c for c in required if c not in classes]
          if missing:
              sys.exit(f"required JVM unit classes did not run: {missing}")
          if bad:
              sys.exit("JVM unit test failure")
          PY

      # connectedDebugAndroidTest passes vacuously if it discovers no
      # tests. Assert a floor well below the real count and that the
      # classes carrying the security-critical assertions actually ran
      # (fixture parity suite, Keystore key-flag checks).
      - name: Verify instrumented tests ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob(
              "android/app/build/outputs/androidTest-results/connected/**/*.xml",
              recursive=True,
          )
          if not files:
              sys.exit("no instrumented test result XML found")
          total = bad = 0
          classes = set()
          for f in files:
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0))
              bad += int(r.get("failures", 0)) + int(r.get("errors", 0))
              for tc in r.iter("testcase"):
                  classes.add(tc.get("classname", ""))
          print(f"instrumented tests: {total}, failures+errors: {bad}")
          print("classes:", ", ".join(sorted(classes)))
          if total < 30:
              sys.exit(f"expected >= 30 instrumented tests, saw {total}")
          required = [
              "com.ahlyxlabs.conveyance.crypto.CryptoFixtureParityTest",
              "com.ahlyxlabs.conveyance.session.NoiseHandshakeParityTest",
              "com.ahlyxlabs.conveyance.session.NoiseSessionRoundTripTest",
              "com.ahlyxlabs.conveyance.storage.keystore.KeystoreKeysTest",
              "com.ahlyxlabs.conveyance.storage.identity.IdentityVaultTest",
              "com.ahlyxlabs.conveyance.storage.credentials.CredentialStoreTest",
              "com.ahlyxlabs.conveyance.storage.log.ApprovalLogTest",
              "com.ahlyxlabs.conveyance.storage.pairings.PairingStoreTest",
              "com.ahlyxlabs.conveyance.storage.StorageGraphTest",
          ]
          missing = [c for c in required if c not in classes]
          if missing:
              sys.exit(f"required instrumented classes did not run: {missing}")
          if bad:
              sys.exit("instrumented test failure")
          PY

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
            android/app/build/reports/tests/
            android/app/build/test-results/
          if-no-files-found: ignore
