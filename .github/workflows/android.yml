name: Android CI

# Scoped to the Android track. The Rust workflow (ci.yml) is scoped away
# from android/**, but the Android build now cross-compiles the
# conveyance-crypto-ffi Rust crate (phase 10.1 UniFFI bridge), so changes
# to that crate — and its conveyance-crypto dependency, and the workspace
# manifests — must trigger this workflow too.
on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "crates/conveyance-crypto/**"
      - "crates/conveyance-crypto-ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
      - "crates/conveyance-crypto/**"
      - "crates/conveyance-crypto-ffi/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: rust bridge + lint + unit + assemble + instrumented
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # AGP 8.x requires JDK 17. The ubuntu runner ships the Android SDK
      # and NDK (ANDROID_HOME / ANDROID_NDK_LATEST_HOME preset).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # Rust side of the UniFFI bridge. Toolchain pinned to match
      # rust-toolchain.toml / ci.yml; both Android ABIs added as targets.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.98.0"
          targets: aarch64-linux-android,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # cargo-ndk finds the NDK via ANDROID_NDK_HOME; the runner only
      # sets ANDROID_NDK_LATEST_HOME by default.
      - run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      # Fixture drift gate. crypto_fixtures.json is ground truth for the
      # instrumented Rust<->Kotlin parity suite; regenerate it from
      # conveyance-crypto and fail if it differs from the committed copy,
      # so a change to a primitive that is not mirrored into the fixture
      # (and thus into the Kotlin assertion) cannot land silently.
      - name: Regenerate crypto fixtures and check for drift
        run: |
          cargo run --locked -p conveyance-crypto --example emit_fixtures -- \
            android/app/src/androidTest/assets/crypto_fixtures.json
          git diff --exit-code -- android/app/src/androidTest/assets/crypto_fixtures.json \
            || { echo "::error::crypto_fixtures.json is stale; run the emitter and commit it"; exit 1; }

      - uses: gradle/actions/setup-gradle@v4

      - run: chmod +x ./gradlew
        working-directory: android

      # KVM permissions so the emulator runs with hardware acceleration.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # Cross-compiles conveyance-crypto-ffi to a .so for BOTH ABIs
      # (arm64-v8a is build-verified here; x86_64 is exercised by the
      # instrumented test below), generates the Kotlin bindings, runs
      # lint + JVM unit tests + assembles the APK, then runs the
      # instrumented HKDF-BLAKE2s round-trip test on an x86_64 emulator.
      - name: lint + unit + assemble + instrumented
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          working-directory: android
          script: >-
            ./gradlew --no-daemon
            lintDebug
            testDebugUnitTest
            assembleDebug
            connectedDebugAndroidTest

      # connectedDebugAndroidTest passes vacuously if it discovers no
      # tests. The Rust<->Kotlin fixture parity suite plus the HKDF spike
      # round-trip must actually execute on the emulator, so assert a
      # floor well below their real count (parity suite 9 + spike 3 = 12).
      - name: Verify instrumented tests ran
        run: |
          python3 - <<'PY'
          import glob, sys, xml.etree.ElementTree as ET
          files = glob.glob(
              "android/app/build/outputs/androidTest-results/connected/**/*.xml",
              recursive=True,
          )
          if not files:
              sys.exit("no instrumented test result XML found")
          total = bad = 0
          classes = set()
          for f in files:
              r = ET.parse(f).getroot()
              total += int(r.get("tests", 0))
              bad += int(r.get("failures", 0)) + int(r.get("errors", 0))
              for tc in r.iter("testcase"):
                  classes.add(tc.get("classname", ""))
          print(f"instrumented tests: {total}, failures+errors: {bad}")
          print("classes:", ", ".join(sorted(classes)))
          if total < 10:
              sys.exit(f"expected >= 10 instrumented tests, saw {total}")
          if "com.ahlyxlabs.conveyance.crypto.CryptoFixtureParityTest" not in classes:
              sys.exit("CryptoFixtureParityTest did not run")
          if bad:
              sys.exit("instrumented test failure")
          PY

      - name: Upload instrumented test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: androidTest-results
          path: |
            android/app/build/reports/androidTests/
            android/app/build/outputs/androidTest-results/
          if-no-files-found: ignore
